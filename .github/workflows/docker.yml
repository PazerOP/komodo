name: Docker

on:
  push:

jobs:
  docker-core:
    name: Build & Push Core
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/actions@ghcr-login#latest
        if: github.ref == 'refs/heads/main'

      - name: Build
        run: |
          docker build \
            -f bin/core/aio.Dockerfile \
            -t ghcr.io/pazerop/komodo-core:latest \
            .

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push ghcr.io/pazerop/komodo-core:latest

      - uses: wow-look-at-my/actions@ghcr-prune#latest
        if: github.ref == 'refs/heads/main'
        with:
          image: ghcr.io/pazerop/komodo-core:latest
          keep: 10

  docker-periphery:
    name: Build & Push Periphery
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/actions@ghcr-login#latest
        if: github.ref == 'refs/heads/main'

      - name: Build
        run: |
          docker build \
            -f bin/periphery/aio.Dockerfile \
            -t ghcr.io/pazerop/komodo-periphery:latest \
            .

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push ghcr.io/pazerop/komodo-periphery:latest

      - uses: wow-look-at-my/actions@ghcr-prune#latest
        if: github.ref == 'refs/heads/main'
        with:
          image: ghcr.io/pazerop/komodo-periphery:latest
          keep: 10
