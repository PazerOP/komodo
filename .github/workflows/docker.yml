name: Docker

on:
  push:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-core:
    name: Build & Push Core
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Write build version
        run: git rev-parse --short HEAD > build_support/BUILD_VERSION

      - name: Build & push (main)
        if: github.ref == 'refs/heads/main'
        uses: wow-look-at-my/actions@ghcr#latest
        with:
          login: 'true'
          push: 'true'
          push_image: ghcr.io/pazerop/komodo-core:latest
          build_dockerfile: bin/core/aio.Dockerfile

      - name: Build only (non-main)
        if: github.ref != 'refs/heads/main'
        uses: wow-look-at-my/actions@ghcr#latest
        with:
          login: 'false'
          push: 'false'
          build_dockerfile: bin/core/aio.Dockerfile

  docker-periphery:
    name: Build & Push Periphery
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Write build version
        run: git rev-parse --short HEAD > build_support/BUILD_VERSION

      - name: Build & push (main)
        if: github.ref == 'refs/heads/main'
        uses: wow-look-at-my/actions@ghcr#latest
        with:
          login: 'true'
          push: 'true'
          push_image: ghcr.io/pazerop/komodo-periphery:latest
          build_dockerfile: bin/periphery/aio.Dockerfile

      - name: Build only (non-main)
        if: github.ref != 'refs/heads/main'
        uses: wow-look-at-my/actions@ghcr#latest
        with:
          login: 'false'
          push: 'false'
          build_dockerfile: bin/periphery/aio.Dockerfile
