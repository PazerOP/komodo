name: Docker

on:
  push:
    branches: [main]

jobs:
  docker-core:
    name: Build & Push Core
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: wow-look-at-my/actions@ghcr-login#latest

      - name: Build and push
        run: |
          docker buildx build \
            -f bin/core/aio.Dockerfile \
            -t ghcr.io/pazerop/komodo-core:latest \
            --push \
            .

      - uses: wow-look-at-my/actions@ghcr-prune#latest
        with:
          image: ghcr.io/pazerop/komodo-core:latest
          keep: 10

  docker-periphery:
    name: Build & Push Periphery
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: wow-look-at-my/actions@ghcr-login#latest

      - name: Build and push
        run: |
          docker buildx build \
            -f bin/periphery/aio.Dockerfile \
            -t ghcr.io/pazerop/komodo-periphery:latest \
            --push \
            .

      - uses: wow-look-at-my/actions@ghcr-prune#latest
        with:
          image: ghcr.io/pazerop/komodo-periphery:latest
          keep: 10
