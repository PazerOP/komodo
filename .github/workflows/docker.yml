name: Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  docker-core:
    name: Build & Push Core
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: wow-look-at-my/actions@docker-publish#latest
        with:
          dockerfile: bin/core/aio.Dockerfile
          image: ghcr.io/pazerop/komodo-core

  docker-periphery:
    name: Build & Push Periphery
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: wow-look-at-my/actions@docker-publish#latest
        with:
          dockerfile: bin/periphery/aio.Dockerfile
          image: ghcr.io/pazerop/komodo-periphery
