name: Docker

on:
  push:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-core:
    name: Build & Push Core
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/actions@ghcr-login#latest
        if: github.ref == 'refs/heads/main'

      - name: Build and push
        run: |
          docker buildx build \
            -f bin/core/aio.Dockerfile \
            -t ghcr.io/pazerop/komodo-core:latest \
            ${{ github.ref == 'refs/heads/main' && '--push' || '' }} \
            .

      - uses: wow-look-at-my/actions@ghcr-prune#latest
        if: github.ref == 'refs/heads/main'
        with:
          image: ghcr.io/pazerop/komodo-core:latest
          keep: 10

  docker-periphery:
    name: Build & Push Periphery
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/actions@ghcr-login#latest
        if: github.ref == 'refs/heads/main'

      - name: Build and push
        run: |
          docker buildx build \
            -f bin/periphery/aio.Dockerfile \
            -t ghcr.io/pazerop/komodo-periphery:latest \
            ${{ github.ref == 'refs/heads/main' && '--push' || '' }} \
            .

      - uses: wow-look-at-my/actions@ghcr-prune#latest
        if: github.ref == 'refs/heads/main'
        with:
          image: ghcr.io/pazerop/komodo-periphery:latest
          keep: 10
